{# Overlay de geração (usado no formulário e no "gerar outra" do resultado) #}
<div class="ia-loading" id="iaLoading" hidden>
  <div class="ia-loading-box" role="dialog" aria-modal="true" aria-labelledby="iaLoadingTitulo" aria-describedby="iaLoadingMsg" tabindex="-1">
    <div class="ia-term" aria-hidden="true">
      <div class="ia-term-bar"><i></i><i></i><i></i><span>allandev@lab — gerador-ia</span></div>
      <div class="ia-term-body">
        <span class="ia-scan"></span>
        <div class="ia-term-log" id="iaTermLog"></div>
      </div>
    </div>
    <h2 id="iaLoadingTitulo">Gerando sua atividade</h2>
    <p class="ia-loading-msg" id="iaLoadingMsg" aria-live="polite">Consultando a IA…</p>
    <div class="ia-loading-bar"><span id="iaLoadingBar"></span></div>
    <p class="ia-loading-tempo">
      <svg class="ia-ico" aria-hidden="true"><use href="#ia-i-clock"/></svg>
      <span><span id="iaLoadingSeg">0</span>s · costuma levar de 10 a 40 segundos — não feche esta aba</span>
    </p>
  </div>
</div>
